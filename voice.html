<script>
(function(){
  const audio = new Audio();
  audio.preload = 'none';
  const tracks = [...document.querySelectorAll('.track')];
  let current = null;

  const fmt = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '';

  function reset(t){ t.classList.remove('playing','paused'); t.querySelector('.t-bar > i').style.width='0'; t.querySelector('.t-time').textContent = t.dataset.dur; }

  tracks.forEach(t => {
    t.addEventListener('click', () => {
      if (current === t) {
        if (audio.paused) { audio.play(); t.classList.add('playing'); t.classList.remove('paused'); }
        else { audio.pause(); t.classList.remove('playing'); t.classList.add('paused'); }
        return;
      }
      if (current) reset(current);
      current = t;
      audio.src = t.dataset.src;
      audio.play().then(() => { t.classList.add('playing'); t.classList.remove('paused'); }).catch(() => reset(t));
    });
  });

  audio.addEventListener('timeupdate', () => {
    if (!current || !audio.duration) return;
    current.querySelector('.t-bar > i').style.width = (audio.currentTime / audio.duration * 100) + '%';
    current.querySelector('.t-time').textContent = fmt(audio.duration - audio.currentTime);
  });
  audio.addEventListener('ended', () => { if (current) { reset(current); current = null; } });

  // Reveal rows on scroll
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => { if (e.isIntersecting) { setTimeout(() => e.target.classList.add('in'), i * 70); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px' });
    tracks.forEach(t => io.observe(t));
  } else { tracks.forEach(t => t.classList.add('in')); }

  // Floating chat after the fold
  const fab = document.getElementById('fab');
  const onScroll = () => fab.classList.toggle('on', window.scrollY > window.innerHeight * 0.6);
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
})();
</script>

</body>
</html>
