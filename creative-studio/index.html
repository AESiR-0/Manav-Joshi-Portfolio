<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Creative Studio</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x2='1' y2='1'%3E%3Cstop stop-color='%23ff9f5a'/%3E%3Cstop offset='1' stop-color='%23ff4f7b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{color-scheme:light dark;--bg:#f5f5f7;--ink:#1d1d1f;--soft:#6e6e73;--card:rgba(255,255,255,.62);--edge:rgba(255,255,255,.8);--field:#fff;--a:rgba(255,178,120,.3);--b:rgba(120,180,255,.3)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--ink:#f5f5f7;--soft:#a1a1a6;--card:rgba(40,40,44,.58);--edge:rgba(255,255,255,.16);--field:#1c1c1e;--a:rgba(255,140,80,.14);--b:rgba(60,120,255,.17)}}
*{box-sizing:border-box;margin:0}body{min-height:100dvh;display:grid;place-items:center;padding:20px;font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(42% 46% at 18% 12%,var(--a),transparent 72%),radial-gradient(44% 50% at 86% 84%,var(--b),transparent 72%),var(--bg);-webkit-font-smoothing:antialiased}
form{width:min(340px,100%);padding:30px 26px 26px;border-radius:24px;text-align:center;background:var(--card);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:.5px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge),0 14px 40px rgba(10,12,30,.14)}
.i{width:46px;height:46px;border-radius:13px;margin:0 auto 14px;background:linear-gradient(145deg,#ff9f5a,#ff4f7b);position:relative}.i:after{content:"";position:absolute;inset:12px;border:3.5px solid #fff;border-radius:50%}
h1{font-size:20px;font-weight:650;letter-spacing:-.018em}p{color:var(--soft);margin:3px 0 18px;font-size:14px}
input{width:100%;padding:11px 14px;border:0;border-radius:11px;background:var(--field);font:inherit;color:inherit;outline:0;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}input:focus{box-shadow:0 0 0 3px rgba(0,122,255,.3)}
button{width:100%;margin-top:9px;padding:10px;border:0;border-radius:99px;background:#007aff;color:#fff;font:600 15px/1.3 inherit;font-family:inherit;cursor:pointer}button:disabled{opacity:.6}
#e{min-height:19px;margin:10px 0 -8px;color:#ff3b30;font-size:13px}
form.no{animation:s .36s}@keyframes s{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}@media(prefers-reduced-motion:reduce){form.no{animation:none}}</style></head>
<body><form id="f" autocomplete="on"><div class="i"></div><h1>Creative Studio</h1><p>Enter the password to continue.</p><input id="p" type="password" autocomplete="current-password" aria-label="Password" autofocus required><button id="b">Continue</button><div id="e" role="alert"></div></form>
<script>
const ITER=600000,f=document.getElementById('f'),p=document.getElementById('p'),b=document.getElementById('b'),e=document.getElementById('e');
async function open(pw){const v=new Uint8Array(await (await fetch('vault.bin',{cache:'no-cache'})).arrayBuffer());const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:v.slice(0,16),iterations:ITER},base,{name:'AES-GCM',length:256},false,['decrypt']);const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:v.slice(16,28)},key,v.slice(28));return JSON.parse(new TextDecoder().decode(out))}
function show(a){document.open();document.write(a.html);document.close()}
f.onsubmit=async x=>{x.preventDefault();b.disabled=true;e.textContent='';try{const a=await open(p.value);try{sessionStorage.setItem('cs',p.value)}catch(_){}show(a)}catch(_){e.textContent="That password didn't work.";f.classList.remove('no');void f.offsetWidth;f.classList.add('no');p.select();b.disabled=false}};
try{const s=sessionStorage.getItem('cs');if(s)open(s).then(show).catch(()=>{})}catch(_){}
</script></body></html>
