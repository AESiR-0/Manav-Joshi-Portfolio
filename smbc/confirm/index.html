<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your seat, Sunday Morning Build Club</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2e5b34">
<!--
  The seat page moved to /seat/ so the link in a WhatsApp message reads like
  something. This stub stays forever: every token already sent out points here,
  and an invite link that dies is the one message that must never break.
  It carries ?k= across untouched.
-->
<style>
  html{background:#2e5b34}
  body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
       background:#2e5b34;color:#7df0a8;font:500 15px/1.5 system-ui,sans-serif;padding:24px;text-align:center}
  a{color:#7df0a8}
</style>
<script>
  (function () {
    var q = location.search || '';
    location.replace('/seat/' + q);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/seat/"></noscript>
</head>
<body>
  <p>Taking you to your seat… <a id="go" href="/seat/">tap here if nothing happens</a>.</p>
  <script>
    document.getElementById('go').href = '/seat/' + (location.search || '');
  </script>
</body>
</html>
